services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: drop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drop_dev_pw}
      POSTGRES_DB: drop_marketplace
    ports:
      - "127.0.0.1:5432:5432"   # escuta só em localhost — nunca exposto à internet
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
