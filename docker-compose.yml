services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: drop_marketplace
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  mongo-express:
    image: mongo-express:1.0.0
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
    ports:
      - "8081:8081"
    depends_on:
      - mongo

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: drop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drop_dev_pw}
      POSTGRES_DB: drop_marketplace
    ports:
      - "127.0.0.1:5432:5432"   # escuta só em localhost — nunca exposto à internet
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  mongo-data:
  postgres-data:
